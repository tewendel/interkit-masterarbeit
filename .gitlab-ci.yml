stages:
  - build
  - deploy

# This file is a template, and might need editing before it works on your project.
docker-build-master:
  # Official docker image.
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - INTERKIT_IMAGE_TAG=latest docker-compose build
    - INTERKIT_IMAGE_TAG=latest docker-compose push
    - INTERKIT_IMAGE_TAG=$CI_COMMIT_SHORT_SHA docker-compose build
    - INTERKIT_IMAGE_TAG=$CI_COMMIT_SHORT_SHA docker-compose push
  only:
    - main

