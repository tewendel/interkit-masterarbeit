stages:
  - build
  - deploy

# This file is a template, and might need editing before it works on your project.
docker-build:
  # Official docker image.
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    #- INTERKIT_IMAGE_TAG=latest docker-compose pull
    - docker pull interkit/server-packages:latest
    - docker pull interkit/server-base:latest
    - docker pull interkit/server:latest
    - docker pull interkit/bundler:latest
    - docker pull interkit/admin:latest
    - docker build --target interkit-packages --cache-from interkit/server-packages:latest -t interkit/server-packages:latest -f Dockerfile.meteor-server .
    - docker build --target meteor-base --cache-from interkit/server-base:latest -t interkit/server-base:latest -f Dockerfile.meteor-server .
    - docker build --cache-from interkit/server:latest -t interkit/server:latest -t interkit/server:$CI_COMMIT_SHORT_SHA -f Dockerfile.meteor-server .
    - docker build --cache-from interkit/bundler:latest -t interkit/bundler:latest -t interkit/bundler:$CI_COMMIT_SHORT_SHA -f Dockerfile.app-bundler .
    - docker build --cache-from interkit/admin:latest -t interkit/admin:latest -t interkit/admin:$CI_COMMIT_SHORT_SHA -f Dockerfile.svelte-admin .
    - docker push interkit/server-packages:latest
    - docker push interkit/server-base:latest
    - docker push interkit/server:latest
    - docker push interkit/bundler:latest
    - docker push interkit/admin:latest
    - docker push interkit/server:$CI_COMMIT_SHORT_SHA
    - docker push interkit/bundler:$CI_COMMIT_SHORT_SHA
    - docker push interkit/admin:$CI_COMMIT_SHORT_SHA
  #only:
  #  - main

