stages:
  - prepare
  - build
  - deploy

docker-build-base:
  # Official docker image.
  image: docker:latest
  stage: prepare
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    #- INTERKIT_IMAGE_TAG=latest docker-compose pull
    - docker pull interkit/interkit-packages:latest || true
    - docker build --cache-from interkit/interkit-packages:latest -f Dockerfile.interkit-packages -t interkit/interkit-packages:latest .
    - docker push interkit/interkit-packages:latest

docker-build-server:
  # Official docker image.
  image: docker:latest
  stage: build
  services:
    - docker:dind
  needs:
    - docker-build-base
  before_script:
    - apk add --no-cache docker-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    #- INTERKIT_IMAGE_TAG=latest docker-compose pull
    - docker pull interkit/interkit-packages:latest || true
    - docker pull interkit/server-base:latest || true
    - docker pull interkit/server:latest || true
    - docker build --cache-from interkit/interkit-packages:latest -f Dockerfile.interkit-packages -t interkit/interkit-packages:latest .
    - docker build --target meteor-base --cache-from interkit/server-packages:latest --cache-from interkit/server-base:latest -t interkit/server-base:latest -f Dockerfile.meteor-server .
    - docker build --cache-from interkit/interkit-packages:latest --cache-from interkit/server-base:latest --cache-from interkit/server:latest -t interkit/server:latest -t interkit/server:$CI_COMMIT_SHORT_SHA -f Dockerfile.meteor-server .
    - docker push interkit/server-base:latest
    - docker push interkit/server:latest
    - docker push interkit/server:$CI_COMMIT_SHORT_SHA

docker-build-bundler:
  # Official docker image.
  image: docker:latest
  stage: build
  services:
    - docker:dind
  needs:
    - docker-build-base
  before_script:
    - apk add --no-cache docker-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    #- INTERKIT_IMAGE_TAG=latest docker-compose pull
    - docker pull interkit/interkit-packages:latest || true
    - docker pull interkit/bundler:latest || true
    - docker build --cache-from interkit/interkit-packages:latest --cache-from interkit/bundler:latest -t interkit/bundler:latest -t interkit/bundler:$CI_COMMIT_SHORT_SHA -f Dockerfile.app-bundler .
    - docker push interkit/bundler:latest
    - docker push interkit/bundler:$CI_COMMIT_SHORT_SHA

docker-build-admin:
  # Official docker image.
  image: docker:latest
  stage: build
  services:
    - docker:dind
  needs:
    - docker-build-base
  before_script:
    - apk add --no-cache docker-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    #- INTERKIT_IMAGE_TAG=latest docker-compose pull
    - docker pull interkit/interkit-packages:latest || true
    - docker pull interkit/admin:latest || true
    - docker build --cache-from interkit/interkit-packages:latest --cache-from interkit/admin:latest -t interkit/admin:latest -t interkit/admin:$CI_COMMIT_SHORT_SHA -f Dockerfile.svelte-admin .
    - docker push interkit/admin:latest
    - docker push interkit/admin:$CI_COMMIT_SHORT_SHA

.deploy: &deploy
  stage: deploy
  image: ubuntu
  when: manual
  #only:
  #  - main
  except:
    - merge_requests
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo INTERKIT_IMAGE_TAG=$CI_COMMIT_SHORT_SHA > .env
    - echo $INTERKIT_ENV_FILE | tr ' ' '\n' >> .env
    - apt-get install rsync -y
    - rsync -e ssh -v -a {docker-compose.yml,.env} $SSH_USER@$SSH_HOST:~/$CI_PROJECT_NAME/
    - echo "docker system prune -af && cd ~/$CI_PROJECT_NAME && ls -la && docker-compose pull && docker-compose up -d --remove-orphans" | ssh $SSH_USER@$SSH_HOST 

deploy-demo:
  <<: *deploy
  environment:
    name: demo
    url: https://demo.interkit.app
  stage: deploy


