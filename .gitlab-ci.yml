.deploy: &deploy
  stage: deploy
  image: ubuntu
  when: manual
  only:
    - main
  except:
    - merge_requests
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo INTERKIT_IMAGE_TAG=$CI_COMMIT_SHORT_SHA > .env
    - echo $INTERKIT_ENV_FILE >> .env
    - scp docker-compose.yml $SSH_USER@$SSH_HOST:~/$CI_PROJECT_NAME/docker-compose.yml
    - scp .env $SSH_USER@$SSH_HOST:~/$CI_PROJECT_NAME/.env
    - echo "cd ~/$CI_PROJECT_NAME && ls -la && docker-compose pull && docker-compose up -d --remove-orphans" | ssh $SSH_USER@$SSH_HOST 

deploy-master-demo:
  <<: *deploy
  environment:
    name: demo
    url: https://demo.interkit.app
  stage: deploy


