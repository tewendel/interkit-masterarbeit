version: '3.2'

services:

  server:
    image: interkit/server:${INTERKIT_IMAGE_TAG}
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile.meteor-server
      args:
      - INTERKIT_IMAGE_TAG=${INTERKIT_IMAGE_TAG}
    expose:
      - 3000
    volumes:
      - mediafiles:/var/mediafiles
    depends_on:
      - mongo
    environment:
      ROOT_URL: $INTERKIT_SERVER_URL
      MONGO_URL: mongodb://mongo:27017/meteor
      MEDIAFILES_PATH: /var/mediafiles
      PORT: 3000
      BUNDLER_URL: $INTERKIT_BUNDLER_URL
      BUNDLER_PASSWORD: $INTERKIT_BUNDLER_PASSWORD
      ADMIN_PASSWORD: $INTERKIT_ADMIN_PASSWORD
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontproxy"
      - "traefik.http.routers.server-${INTERKIT_IMAGE_TAG}.rule=Host(`${INTERKIT_SERVER_HOST}`)"
    networks:
      - frontproxy
      - default

  mongo:
    image: mongo:4.4
    restart: always
    command:
      - --storageEngine=wiredTiger
    volumes:
      - db-data:/data/db
    networks:
      - default

  admin:
    image: interkit/admin:${INTERKIT_IMAGE_TAG}
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile.svelte-admin
      args:
      - INTERKIT_IMAGE_TAG=${INTERKIT_IMAGE_TAG}
    expose:
      - 5000
    environment:
      INTERKIT_SERVER_WEBSOCKETS_URL: $INTERKIT_SERVER_WEBSOCKETS_URL
      INTERKIT_SERVER_URL: $INTERKIT_SERVER_URL
      INTERKIT_IMAGE_TAG: $INTERKIT_IMAGE_TAG
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontproxy"
      - "traefik.http.routers.admin-${INTERKIT_IMAGE_TAG}.rule=Host(`${INTERKIT_ADMIN_HOST}`)"
    networks:
      - frontproxy
      - default

  bundler:
    image: interkit/bundler:${INTERKIT_IMAGE_TAG}
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile.app-bundler
      args:
      - INTERKIT_IMAGE_TAG=${INTERKIT_IMAGE_TAG}
    expose:
      - 4000
    volumes:
      - projects:/var/repositories/projects
    environment:
      PORT: 4000
      ADMIN_PASSWORD: $INTERKIT_ADMIN_PASSWORD
      BUNDLER_PASSWORD: $INTERKIT_BUNDLER_PASSWORD
      INTERKIT_BUNDLER_URL: $INTERKIT_BUNDLER_URL
      INTERKIT_SERVER_WEBSOCKETS_URL: $INTERKIT_SERVER_WEBSOCKETS_URL
      INTERKIT_SERVER_SERVERSIDE_WEBSOCKETS_URL: $INTERKIT_SERVER_SERVERSIDE_WEBSOCKETS_URL
      INTERKIT_SERVER_URL: $INTERKIT_SERVER_URL
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontproxy"
      - "traefik.http.routers.bundler-${INTERKIT_IMAGE_TAG}.rule=Host(`${INTERKIT_BUNDLER_HOST}`)"
      - "traefik.http.middlewares.bundler-${INTERKIT_IMAGE_TAG}.headers.accesscontrolalloworiginlist=*"
    networks:
      - frontproxy
      - default

networks:
  frontproxy:
    external: true

volumes:
  db-data:
  #repositories:
  #  driver_opts:
  #    type: none
  #    device: ./repositories
  #    o: bind
  projects:
  mediafiles:
