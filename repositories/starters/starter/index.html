<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset='utf-8'>

	<title>interkit app</title>

	<link rel='icon' type='image/png' href='/favicon.png'>
	<link rel="manifest" href="public/manifest.webmanifest">

	<meta name='viewport'
		content='width=device-width,initial-scale=1,viewport-fit=cover,initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
	<meta name="apple-mobile-web-app-capable" content="yes" />

	<script>
		window.onerror = function (msg, source, lineNo, columnNo, error) {
			// function to execute error handling
			window.parent.postMessage({ msg, source, lineNo, columnNo }, "*")
			return false
		}
	</script>

</head>

<body>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>

</html>
