name: MapSimple
title: MapSimple
fields:
  - type: extraProps
    props:
    - type: "string"
      name: "defaultLocation"
      help: "Where to center the map if a user's location cannot be found. Format: [lat, lng]"
    - type: number
      name: defaultZoom
      defaultValue: 13
      help: "Default initial zoom level for the map"
    - type: "sheetColumn"
      name: "markerPositionsColumn"
      columnType: "location"
      defaultValue: "elements/position"
      help: The column with the location info
    - type: "sheetColumn"
      name: "customIconColumn"
      columnType: "mediaFile"
      defaultValue: "elements/mapMarkerIcon"
      help: Optionally show images on the markers from this column
    - type: "sheetColumn"
      name: "markerLabelColumn"
      columnType: "string"
      defaultValue: "elements/markerLabel"
      help: "A number or letter to put in the marker"
    - type: "sheetColumn"
      name: "markerTitleColumn"
      columnType: "string"
      defaultValue: "elements/markerTitle"
      help: "A title to show on the map above the marker"
    - type: string
      name: checkedProperty
      defaultValue: "checked"
      help: A DataAnnotation to use for displaying a check mark in the marker
    - type: "string"
      name: "permissionNotification"
    - type: "string"
      name: "enableGeolocationHint"
    - type: string
      name: mapId
      defaultValue: map
      help: An individual identifier, change only if you have multiple maps open at the same time
    - type: string
      name: height
      defaultValue: 100%
    - type: checkbox
      name: showControls
      defaultValue: true
    - type: checkbox
      name: showPopups
      defaultValue: true
    - type: checkbox
      name: inline
      defaultValue: false
      help: Show a map with rounded corners
    - type: checkbox
      name: nearestElementMode
      defaultValue: false
      help: Show only the marker closest to the user's position
    - type: checkbox
      name: disableControls
      defaultValue: false
      help: "prevent user from zooming and panning"
    - type: checkbox
      name: singleElementContext
      help: "The map shows a single marker defined by a single element context."
      defaultValue: false
    - type: string
      name: tileLayer
      defaultValue: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      help: "A tile url, for example https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    - type: string
      name: mapBoxGLStyle
      help: The url to a a vector map style json, for example from MapTiler (takes precedece over tileLayer if set)
    - type: string
      name: clickTrigger
    - type: string
      name: closeButtonLabel
      defaultValue: "Schließen"
  - type: "slot"
    name: "popup"  
    help: Contents of a popup that opens when a marker is tapped
  - type: "slot"
    name: "button"
    help: Buttons or a ButtonBar displayed on top of the map
toolboxCategory: Map
