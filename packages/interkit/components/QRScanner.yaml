name: QRScanner
colour: 100
fields: 
  - type: sheetColumn
    name: elementKeyColumn
    columnType: string
    defaultValue: elements/qrKey
  - type: sheetColumn
    name: elementLocationColumn
    columnType: location
    defaultValue: elements/position
  - type: sheetColumn
    name: tipQrKeyColumn
    columnType: string
    defaultValue: tips/qrKey
  - type: sheetColumn
    name: tipImageColumn
    columnType: mediaFile
    defaultValue: tips/image
  - type: sheetColumn
    name: tipTextColumn
    columnType: string
    defaultValue: tips/text
  - type: sheetColumn
    name: tipOrderColumn
    columnType: number
    defaultValue: tips/order
  - type: string
    name: closeTrigger
    defaultValue: closeQR
  - type: slot
    name: map
toolboxCategory: QR Scanner