name: Button
title: Button
colour: 300
fields:
  - type: string
    name: text
  - type: extraProps
    props:
    - type: clickEffect
      name: effect
    - name: type
      type: options
      options:
        - primary 
        - secondary
        - ghost 
        - link 
        - spacer
        - list-item
        - nav-tab
    - type: options
      name: size
      options: 
        - medium
        - small
        - large
      defaultValue: medium
    - type: options
      name: flex
      options: 
        - normal
        - fill
      defaultValue: normal
  - name: default
    type: slot
toolboxCategory: Buttons
