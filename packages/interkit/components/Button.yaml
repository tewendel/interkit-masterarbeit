name: Button
colour: 300
fields:
  - type: string
    name: text
    help: "Text on the button."
  - type: extraProps
    props:
    - name: type
      type: options
      options:
        - secondary
        - primary 
        - ghost 
        - link 
        - danger
      defaultValue: secondary
      help: "Appearance of the button."
    - name: size
      type: options
      options: 
        - small
        - medium
        - large
      defaultValue: small
      help: "Large, medium or small."
    - name: flex
      type: options
      options: 
        - normal
        - fill
      defaultValue: normal
      help: "If used in the slot of a flex-supported parent component, determines how the available space is used."
    - name: disabled
      type: checkbox
      defaultValue: false
    - type: effect
      name: effect
      help: "The type of effect (or action) the button should trigger. It can interact with the Routes; act as an HTML link; trigger into actions.js or set various variables."
  - name: default
    type: slot
    help: "If text is not enough, you can place child components here, e.g. formatted text. Will override text."
toolboxCategory: Buttons
