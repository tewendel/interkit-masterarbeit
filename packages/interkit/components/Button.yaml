name: Button
title: Button
colour: 300
fields:
  - type: string
    name: text
  - type: extraProps
    props:
    - type: options
      name: clickType
      options:
        - path
        - back
        - payloadTrigger
        - link
        - linkTargetBlank
      defaultValue: path
    - type: string
      name: clickTrigger
    - type: options
      name: type
      options: 
        - primary
        - secondary
        - ghost
        - link
        - list-item
        - nav-tab
        - spacer
    - type: options
      name: size
      options: 
        - medium
        - small
        - large
      defaultValue: medium
    - type: options
      name: flex
      options: 
        - normal
        - fill
      defaultValue: normal
  - name: default
    type: slot
toolboxCategory: Buttons
