name: NavButton
colour: 300
fields:
  - type: string
    name: text
    help: "Text on the button."
  - type: extraProps
    props:
    - name: disabled
      type: checkbox
      defaultValue: false
    - type: effect
      name: effect
      help: "The type of effect (or action) the button should trigger. It can interact with the Routes; act as an HTML link; trigger into actions.js or set various variables."
  - name: default
    type: slot
    help: "Add the icon here."
docsPath: NavBar#navbutton
toolboxCategory: Navigation
