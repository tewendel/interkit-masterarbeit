name: VideoButton
colour: 300
fields:
  - type: extraProps
    props:
    - name: videoColumn
      type: sheetColumn
      columnType: mediaFile
      help: "The column on the element context (for example DataLoaderSingle) containing the video file"
    - name: mediafileKey
      type: string
      help: "Optionally use the key of a media file directly"
    - name: vimeoUrl
      type: string
      help: "Optionally provide the url of a video hosted on vimeo for embedding"
    - name: controls
      type: options
      options:
        - interkit
        - native
        - none
      defaultValue: interkit
    - name: loop
      type: checkbox
      defaultValue: false
    - name: buttonOptions
      type: buttonOptions
  - type: slot
    name: Icon
toolboxCategory: Media