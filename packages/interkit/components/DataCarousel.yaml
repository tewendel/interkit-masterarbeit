name: DataCarousel
toolboxCategory: Data Display (multi)
color: 230
fields:
  - type: extraProps
    props:
      - name: mode
        type: options
        options:
          - single
          - continuous
        help: Use single mode to size each element on 85% of full width, with 15% of the next element just showing on the edge. Use continuos to use the elements own width, for example DataTiles.
      - name: roundedCorners
        type: checkbox
        defaultValue: false
        help: Check this to round corners on the first and last slides
      - name: background
        type: checkbox
        defaultValue: true
        help: Show the background color around the items and add padding
      - name: gaps
        type: checkbox
        defaultValue: true
        help: Leave a gap between the elements
  - name: contentElement
    type: slot
    help: Define how each element in the carousel is displayed, for example with DataCard
  - name: emptyElement
    type: slot
    help: This is displayed if there are no elements to show.
docsPath: DataList#datacarousel

