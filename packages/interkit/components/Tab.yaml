name: Tab
colour: 300
fields:
  - type: string
    name: text
    help: "Text on the tab."
  - type: extraProps
    props:
    - type: effect
      name: effect
      help: "The type of effect (or action) the tab should trigger when pressed. Usually used with Route."
    - type: checkbox
      name: execOnMount
      help: "Runs the effect once when the button is rendered (for example to set a default value)"
docsPath: TabBar#tab
toolboxCategory: Buttons
