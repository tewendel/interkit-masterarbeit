name: DataCard
fields:
  - type: extraProps  
    props:
      - name: variant
        type: options
        options:
          - full
          - large
          - medium
          - small
        defaultValue: full
      - name: rightArrow
        type: checkbox
        help: Display the right arrow next to the headline      
      - name: effect
        type: effect
        help: What should happen when you tap on the card
      - name: imageColumn
        type: sheetColumn
        columnType: mediaFile
        defaultValue: elements/image
      - name: headlineColumn
        type: sheetColumn
        defaultValue: elements/headline
      - name: label1Column
        type: sheetColumn
        defaultValue: elements/label1
      - name: subtitle1Column
        type: sheetColumn
        defaultValue: elements/subtitle1
      - name: label2Column
        type: sheetColumn
        defaultValue: elements/label2
      - name: subtitle2Column
        type: sheetColumn
        defaultValue: elements/subtitle2
      - name: label3Column
        type: sheetColumn
        defaultValue: elements/label3
      - name: subtitle3Column
        type: sheetColumn
        defaultValue: elements/subtitle3
      - name: descriptionColumn
        type: sheetColumn
        defaultValue: elements/description
  - type: slot
    name: chips
    help: "Use this slot to place dynamic labels, for example for bookmarks. These are diplayed to the right of the headline."
  - type: slot
    name: content
    help: "Use this slot to place further content inside the card, for example a ButtonBar or a DataCell."
toolboxCategory: Data Display (single)
docsPath: DataCard

